<div class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg p-6 w-full max-w-lg">
    <h2 class="text-xl font-semibold text-blue-600 mb-4">Agregar Premio</h2>
    <form [formGroup]="prizeForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-gray-700">Nombre del Premio</label>
        <input formControlName="name" type="text" class="w-full px-3 py-2 border rounded" />
      </div>
      <div class="mb-4">
        <label class="block text-gray-700">Descripción</label>
        <textarea formControlName="description" class="w-full px-3 py-2 border rounded"></textarea>
      </div>
      <div class="mb-4">
        <label class="block text-gray-700">Valor del Premio</label>
        <input formControlName="valueReward" type="number" class="w-full px-3 py-2 border rounded" />
      </div>
      <div *ngIf="successMessage" class="text-green-500 text-center mb-4">{{ successMessage }}</div>
      <div class="flex justify-end">
        <button type="button" (click)="closeForm()" class="bg-gray-500 text-white px-4 py-2 rounded mr-2">
          Cancelar
        </button>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
