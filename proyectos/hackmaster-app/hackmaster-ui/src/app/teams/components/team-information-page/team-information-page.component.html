<app-header></app-header>

<!-- Contenedor blanco que envuelve a los componentes -->
<div class="w-[970px] h-[1000px] p-5 border border-gray-300 bg-white rounded-lg mx-auto flex flex-col gap-5 ml-[-10px] mt-[0px]">

  <h1 class="text-2xl font-bold text-center mb-5 text-gray-800">INFORMACIÓN DEL EQUIPO</h1>

  <!-- Nuevo contenedor gris para team-name debajo del título -->
  <div class="w-[500px] ml-[396px] mt-[0px] flex justify-center items-center">
    <app-team-name></app-team-name>
  </div>

  <!-- Contenedor de team-participants y description -->
  <div class="flex gap-5 justify-between w-full p-5">
    <div class="flex-1 ml-[1200px] mt-[-100px]">
      <app-team-participants (participants)="teamInfo.memberNames"></app-team-participants>
    </div>
  </div>

  <div *ngIf="isAdmin" class="flex-1 ml-[650px] mt-[-350px]">
    <app-add-participant-button></app-add-participant-button>
  </div>

</div>
<app-footer class="footer mt-5"></app-footer>
<!-- Contenedor de side-bar con botones incluidos -->
<div style="width: 200px; height: 500px; margin-top: -1400px;">
  <app-side-bar>
    <app-side-bar-button3 *ngIf="!isAdmin" class="w-[148px] ml-[30px] mt-[100px]" (click)="showMembersPageComponent()"></app-side-bar-button3>
    <app-side-bar-button4 *ngIf="!isAdmin" class="w-[130px] ml-[30px] mt-4"></app-side-bar-button4>
  </app-side-bar>
</div>

<!-- Mostrar app-members-page solo si showMembersPage es verdadero -->
<div *ngIf="showMembersPage" class="flex justify-center items-center h-screen" style="margin-top: -900px;">
  <app-members-page (close)="showMembersPage = false"></app-members-page> <!-- Escucha el evento close -->
</div>
