<div class="border border-gray-300 p-5 rounded-lg w-[400px] mx-auto text-center bg-gray-100 relative" style="margin-top: 150px;">

  <h2 class="text-2xl mb-5 text-gray-800">Miembros</h2>
  <div class="flex flex-col gap-2">
    <button class="py-2 text-lg font-semibold rounded-md cursor-pointer bg-blue-500 text-white transition-colors duration-300 hover:bg-blue-700">Invitar participante</button>
    <button class="py-2 text-lg font-semibold rounded-md cursor-pointer bg-blue-500 text-white transition-colors duration-300 hover:bg-blue-700">Ver actividad</button>
    <button class="py-2 text-lg font-semibold rounded-md cursor-pointer bg-blue-500 text-white transition-colors duration-300 hover:bg-blue-700">Borrar miembro</button>
  </div>
</div>
