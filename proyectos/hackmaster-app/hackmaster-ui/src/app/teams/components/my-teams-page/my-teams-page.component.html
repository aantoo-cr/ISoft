<div class="page-container">
  <app-header class="header"></app-header>
  <main class="main-content">

    <section class="teams-page">
      <h3 class="teams-title">Mis equipos</h3>
      <app-nav-bar (searchChanged)="onSearchChange($event)" class="nav-bar"></app-nav-bar>
      <app-team-cards [teams]="myTeams" class="team-container"></app-team-cards>
    </section>
  </main>

  <app-footer class="footer"></app-footer>
</div>
