<div class="page-container">
  <app-header class="header"></app-header>
  <main class="main-content">
    <app-team-side-bar class="side-bar" (myTeamsClick)="onMyTeamsClick()"></app-team-side-bar>

    <section class="teams-page">
      <h3 class="teams-title">Equipos</h3>
      <app-nav-bar (searchChanged)="onSearchChange($event)" class="nav-bar"></app-nav-bar>
      <app-team-cards [teams]="teams" class="teams-preview-container"></app-team-cards>
    </section>
  </main>

  <app-footer class="footer"></app-footer>
</div>
