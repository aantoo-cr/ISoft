<div class="full-screen-bg">

    <h2 class="text-3xl font-semibold text-white text-center mb-7">
      Gestión de Solicitudes
    </h2>

      <app-requests-list></app-requests-list>
    </div>
    <div class="flex justify-center mt-10 gap-4">
      <button
        (click)="reloadRequests()"

        Refrescar
      </button>
      <button

      >
        Cerrar sesión
      </button>
    </div>
  </div>
</div>
