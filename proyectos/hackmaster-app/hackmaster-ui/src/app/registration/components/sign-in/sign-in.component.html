<div class="full-screen-bg">
  <section class="bg-[#F4F7FF] py-16 lg:py-[10px] dark:bg-dark">
    <div class="container mx.auto">
      <div class="flex flex-wrap -mx-4">
        <div class="w-full px-4">
          <div
            class="wow fadeInUp relative max-w-full overflow-hidden rounded-xl shadow-form bg-white dark:bg-dark-2 py-10 px-7 text-center sm:px-8 md:px-10"
          >
            <div class="text-center mb-3">
              <h1
                class="text-4xl font-extrabold text-gray-900 dark:text-dark-6 mb-2"
              >
                Iniciar Sesión
              </h1>
            </div>

            <form>
              <div class="mb-5">
                <label
                  for="email"
                  class="block text-xl text-left font-medium mb-2"
                  >Correo</label
                >
                <input
                  name="email"
                  type="email"
                  placeholder="Correo"
                  (input)="onEmailChange($event)"
                  class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color"
                />
              </div>

              <div class="mb-[15px]">
                <label
                  for="password"
                  class="block text-xl text-left font-medium mb-2"
                  >Contraseña</label
                >
                <input
                  name="password"
                  type="password"
                  placeholder="Contraseña"
                  (input)="onPasswordChange($event)"
                  class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color"
                />

                <div class="text-right mt-2">
                  <a
                    class="text-primary hover:underline text-lg"
                    (click)="onSelectForgotPassword()"
                  >
                    ¿Olvidaste tu contraseña?
                  </a>
                </div>
              </div>

              <div class="mb-8">
                <div class="mb-8">
                  <label
                    class="block text-xl text-left font-medium text-gray-900 dark:text-dark-6 mb-[15px]"
                  >
                    Tipo de Usuario
                  </label>
                  <div class="flex items-center justify-center space-x-4 mb-4">
                    <span class="text-body-color">Participante</span>
                    <div class="relative" (click)="toggleUserType()">
                      <input
                        type="radio"
                        name="userType"
                        [(ngModel)]="userType"
                        value="participant"
                        class="hidden"
                        (input)="onUserTypeChange($event)"
                        required
                      />
                      <input
                        type="radio"
                        name="userType"
                        [(ngModel)]="userType"
                        value="organization"
                        class="hidden"
                        (input)="onUserTypeChange($event)"
                        required
                      />
                      <div
                        class="w-40 h-10 bg-gray-300 rounded-full cursor-pointer transition-all"
                        [ngClass]="{
                          'bg-primary': userType === 'organization',
                          'bg-gray-300': userType !== 'organization',
                        }"
                      >
                        <div
                          class="w-16 h-8 bg-white rounded-full shadow-md transition-transform"
                          [ngClass]="{
                            'translate-x-16': userType === 'organization',
                            'translate-x-0': userType !== 'organization',
                          }"
                        ></div>
                      </div>
                    </div>
                    <span class="text-body-color">Organización</span>
                  </div>
                </div>
              </div>
              <div class="mb-4 flex justify-between">
                <button
                  type="button"
                  class="w-full px-6 py-4 text-lg text-white transition duration-300 ease-in-out border rounded-md cursor-pointer bg-red-600 hover:bg-red-700 shadow-lg hover:shadow-xl transform hover:scale-105 mx-2"
                  (click)="onSelectBack()"
                >
                  Volver Atrás
                </button>

                <button
                  type="submit"
                  class="w-full px-6 py-4 text-lg text-white transition duration-300 ease-in-out border rounded-md cursor-pointer bg-primary hover:bg-primary-dark shadow-lg hover:shadow-xl transform hover:scale-105 mx-2"
                  (click)="login()"
                >
                  Iniciar Sesión
                </button>
              </div>
            </form>

            <span class="relative block text-center z-1 mt-5 mb-5">
              <span
                class="absolute left-0 block w-full h-px -z-1 top-1/2 bg-stroke dark:bg-dark-3"
              ></span>

              <span
                class="relative z-10 inline-block px-3 text-base bg-white dark:bg-dark-2 text-body-secondary"
              >
              </span>
            </span>

            <div class="text-center mt-6">
              <span class="text-body-color">¿Aún no estás registrado?</span>
