<div
  class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center"
>
  <div class="container mx-auto">
    <div class="flex justify-center">
      <div
        class="max-w-md w-full bg-white rounded-2xl shadow-lg p-10 text-center"
      >
        <h2 class="text-4xl font-extrabold text-gray-900 mb-4">
          Recuperar Contraseña
        </h2>
        <p class="text-gray-600 mb-6">
          Ingresa tu correo para recuperar el acceso a tu cuenta.
        </p>
        <form (ngSubmit)="requestPasswordReset()" class="space-y-6">
          <div class="text-left">
            <label
              for="email"
              class="block text-lg font-medium text-gray-700 mb-2"
            >
              Correo Electrónico
            </label>
            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              required
              placeholder="Ingresa tu correo"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-800 bg-[#F4F7FF] focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            />
          </div>
          <div class="flex justify-between items-center space-x-4">
            <button
              type="button"
              (click)="onSelectBack()"
              class="w-1/2 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg shadow-md hover:bg-gray-300 transition duration-300"
            >
              Volver Atrás
            </button>
            <button
              type="submit"
              class="w-1/2 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-300"
            >
              Enviar Solicitud
            </button>
          </div>
        </form>
        <p *ngIf="message" class="mt-6 text-green-600 font-medium">
          {{ message }}
        </p>
        <p *ngIf="errorMessage" class="mt-6 text-red-600 font-medium">
          {{ errorMessage }}
        </p>
      </div>
    </div>
  </div>
</div>
