            data-wow-delay=".15s"
          >

                  />
                </svg>
                <h2 class="text-2xl font-bold text-gray-800 dark:text-gray700">
                  Crear Organización
                </h2>
              </div>
            </div>

            <form>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-[22px]">
                <!-- Username -->
                <div>
                  <label
                    for="username"
                    class="block text-left mb-2 text-body-color dark:text-dark-6"
                    >Username</label
                  >
                  <input
                    type="text"
                    name="username"
                    class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color dark:text-dark-6 placeholder:text-dark-6 focus:border-primary dark:focus:border-primary focus-visible:shadow-none"
                    (input)="onChange($event)"
                    required
                  />
                </div>

                <!-- Contraseña -->
                <div>
                  <label
                    for="password"
                    class="block text-left mb-2 text-body-color dark:text-dark-6"
                    >Contraseña</label
                  >
                  <input
                    type="password"
                    name="password"
                    class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color dark:text-dark-6 placeholder:text-dark-6 focus:border-primary dark:focus:border-primary focus-visible:shadow-none"
                    (input)="onChange($event)"
                    required
                  />
                </div>

                <!-- Email -->
                <div>
                  <label
                    for="email"
                    class="block text-left mb-2 text-body-color dark:text-dark-6"
                    >Email</label
                  >
                  <input
                    type="email"
                    name="email"
                    class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color dark:text-dark-6 placeholder:text-dark-6 focus:border-primary dark:focus:border-primary focus-visible:shadow-none"
                    (input)="onChange($event)"
                    required
                  />
                </div>

                <!-- Razón Social -->
                <div>
                  <label
                    for="socialNameOrganization"
                    class="block text-left mb-2 text-body-color dark:text-dark-6"
                    >Razón Social</label
                  >
                  <input
                    type="text"
                    name="socialNameOrganization"
                    class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color dark:text-dark-6 placeholder:text-dark-6 focus:border-primary dark:focus:border-primary focus-visible:shadow-none"
                    (input)="onChange($event)"
                    required
                  />
                </div>

                <!-- Rut de la Organización -->
                <div>
                  <label
                    for="rutOrganization"
                    class="block text-left mb-2 text-body-color dark:text-dark-6"
                    >RUT de la Organización</label
                  >
                  <input
                    type="text"
                    name="rutOrganization"
                    class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color dark:text-dark-6 placeholder:text-dark-6 focus:border-primary dark:focus:border-primary focus-visible:shadow-none"
                    (input)="onChange($event)"
                    required
                  />
                </div>

                <!-- Rut del Representante -->
                <div>
                  <label
                    for="rutRepresentative"
                    class="block text-left mb-2 text-body-color dark:text-dark-6"
                    >RUT del Representante</label
                  >
                  <input
                    type="text"
                    name="rutRepresentative"
                    class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color dark:text-dark-6 placeholder:text-dark-6 focus:border-primary dark:focus:border-primary focus-visible:shadow-none"
                    (input)="onChange($event)"
                    required
                  />
                </div>

                <!-- Nombre Representante -->
                <div>
                  <label
                    for="representativeName"
                    class="block text-left mb-2 text-body-color dark:text-dark-6"
                    >Nombre Representante</label
                  >
                  <input
                    type="text"
                    name="representativeName"
                    class="w-full px-5 py-3 text-base transition bg-transparent border rounded-md outline-none border-stroke dark:border-dark-3 text-body-color dark:text-dark-6 placeholder:text-dark-6 focus:border-primary dark:focus:border-primary focus-visible:shadow-none"
                    (input)="onChange($event)"
                    required
                  />
                </div>
              </div>

              <!-- Botones -->
              <div class="flex justify-between items-center mt-6 space-x-4">
                <!-- Botón Volver -->
                <button
                  type="button"
                  class="w-full py-3 px-4 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold rounded-lg"
                  (click)="onSelectBack()"
                >
                  Volver atrás
                </button>

                <!-- Botón Registrar -->
                <button
                  type="submit"
                  class="w-full py-3 px-4 text-base text-white transition duration-300 ease-in-out bg-blue-500 hover:bg-blue-600 rounded-lg"
                  (click)="onSubmit($event)"
                >
                  Registrarse
                </button>
              </div>
