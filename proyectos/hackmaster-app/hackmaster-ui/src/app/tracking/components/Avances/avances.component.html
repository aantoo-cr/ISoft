<app-header></app-header>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Proyecto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-blue-100">
<div class="w-full max-w-lg p-8 bg-white rounded shadow-lg">
  <h2 class="text-3xl font-semibold text-center text-blue-600 mb-6">Nombre del Proyecto</h2>

  <!-- Formulario de Avances -->
  <form (ngSubmit)="crearAvances()">
    <div class="mb-6">
      <label class="block text-gray-700 font-bold mb-2" for="url">
        URL Documentación
      </label>
      <input
        type="text"
        id="url"
        name="url"
        formControlName="urlAvance"
        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ingresa la URL de la documentación"
      />
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 font-bold mb-2" for="comments">
        Comentarios
      </label>
      <textarea
        id="comments"
        name="comments"
        formControlName="description"
        rows="3"
        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Escribe un comentario"
      ></textarea>
    </div>

    <div class="flex justify-end mb-6">
      <button
        type="submit"
        class="px-6 py-2 font-bold text-white bg-blue-600 rounded-full hover:bg-blue-700 focus:outline-none focus:shadow-outline"
      >
        Agregar
      </button>
    </div>
  </form>

  <!-- Tabla de Avances Guardados -->
  <div class="mb-8">
    <h3 class="text-lg font-semibold text-gray-700 mb-4">Avances Guardados</h3>
    <table class="w-full border text-gray-700">
      <thead>
      <tr class="bg-blue-100">
        <th class="px-4 py-2 border">URL Documentación</th>
        <th class="px-4 py-2 border">Comentarios</th>
        <th class="px-4 py-2 border">Fecha</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let avance of avances">
        <td class="px-4 py-2 border">{{ avance.urlAvance }}</td>
        <td class="px-4 py-2 border">{{ avance.description }}</td>
        <td class="px-4 py-2 border">{{ avance.date | date: 'short' }}</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-between">
    <button
      type="submit"
      class="px-6 py-2 font-bold text-white bg-blue-600 rounded-full hover:bg-blue-700 focus:outline-none focus:shadow-outline"
    >
      Enviar
    </button>
    <button
      type="button"
      (click)="cancelar()"
      class="px-6 py-2 font-bold text-gray-700 bg-gray-200 rounded-full hover:bg-gray-300 focus:outline-none focus:shadow-outline"
    >
      Cancelar
    </button>
  </div>
</div>
</body>
</html>
<app-footer></app-footer>
