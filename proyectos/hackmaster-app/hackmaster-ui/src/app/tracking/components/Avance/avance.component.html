<header></header>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Proyecto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-blue-100">
<div class="w-full max-w-md p-8 bg-white rounded shadow-lg">
  <h2 class="text-2xl font-semibold text-center mb-6">Nombre del Proyecto</h2>

  <form [formGroup]="miFormulario" (ngSubmit)="crearAvance()">
    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="url">
        URL del Repositorio <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        id="url"
        formControlName="urlAvance"
        required
        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Ingresa la URL del repositorio"
      />
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 font-bold mb-2" for="about">
        Acerca del Proyecto
      </label>
      <textarea
        id="about"
        formControlName="description"
        rows="4"
        class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Describe el proyecto"
      ></textarea>
    </div>

    <div class="flex justify-between">
      <button
        type="submit"
        class="px-4 py-2 font-bold text-white bg-blue-500 rounded hover:bg-blue-700 focus:outline-none focus:shadow-outline"
      >
        Enviar
      </button>
      <button
        type="button"
        (click)="cancelar()"
        class="px-4 py-2 font-bold text-gray-700 bg-gray-200 rounded hover:bg-gray-300 focus:outline-none focus:shadow-outline"
      >
        Cancelar
      </button>
    </div>
  </form>
</div>
</body>
</html>
<footer></footer>
