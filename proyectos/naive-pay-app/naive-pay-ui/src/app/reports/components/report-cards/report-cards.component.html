<div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4 w-full max-w-screen-lg p-4 mt-0">
  <!-- Tarjeta 1 -->
  <div class="p-6 bg-white rounded-lg shadow-lg">
    <div class="flex items-center justify-between">
      <div class="text-blue-500">
        <svg class="w-12 h-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c1.657 0 3-1.343 3-3S13.657 2 12 2 9 3.343 9 5s1.343 3 3 3zm0 0v11m6-7a6 6 0 11-12 0 6 6 0 0112 0z"/>
        </svg>
      </div>
      <div>
        <p class="text-xl font-semibold text-gray-800">Cantidad de Transacciones</p>
        <p class="text-3xl font-bold text-gray-900">{{ metrics.transactionsCount }}</p>
      </div>
    </div>
  </div>

  <!-- Tarjeta 2 -->
  <div class="p-6 bg-white rounded-lg shadow-lg">
    <div class="flex items-center justify-between">
      <div class="text-green-500">
        <svg class="w-12 h-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-3-3m0 0l3-3m-3 3h8a4 4 0 000-8H7m4 13l-3-3m0 0l3-3m-3 3h8a4 4 0 010 8H7"/>
        </svg>
      </div>
      <div>
        <p class="text-xl font-semibold text-gray-800">Total de Transacciones</p>
        <p class="text-3xl font-bold text-gray-900">$ {{ metrics.transactionsTotal | number:'1.0-0' }}</p>
      </div>
    </div>
  </div>

  <!-- Tarjeta 3 -->
  <div class="p-6 bg-white rounded-lg shadow-lg">
    <div class="flex items-center justify-between">
      <div class="text-red-500">
        <svg class="w-12 h-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4H9l4-4m0 8h2v-4h2l-4-4m1 10v2m-3 0h6"/>
        </svg>
      </div>
      <div>
        <p class="text-xl font-semibold text-gray-800">Monto Promedio</p>
        <p class="text-3xl font-bold text-gray-900">$ {{ metrics.transactionsAverage | number:'1.0-0' }}</p>
      </div>
    </div>
  </div>

  <!-- Tarjeta 4 -->
  <div class="p-6 bg-white rounded-lg shadow-lg">
    <div class="flex items-center justify-between">
      <div class="text-yellow-500">
        <svg class="w-12 h-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.24 7.76A5 5 0 1112 4.5v-2a7 7 0 10-5 12.24A7 7 0 0012 18.5a7 7 0 004.24-10.74z"/>
        </svg>
      </div>
      <div>
        <p class="text-xl font-semibold text-gray-800">Comercios Utilizados</p>
        <p class="text-3xl font-bold text-gray-900">{{ metrics.commercesCount }}</p>
      </div>
    </div>
  </div>
</div>
