<div class="flex items-center min-h-screen p-6 bg-gray-50 dark:bg-gray-900">
    <div class="flex-1 h-full max-w-4xl mx-auto overflow-hidden bg-white rounded-lg shadow-xl dark:bg-gray-800">
        <div class="flex flex-col overflow-y-auto md:flex-row">
            <div class="h-32 md:h-auto md:w-1/2">
                <img aria-hidden="true" class="object-cover w-full h-full dark:hidden" src="../assets/img/Restablecer contraseña.png"/>
            </div>

            <div class="flex items-center justify-center p-6 sm:p-12 md:w-1/2">
                <div class="w-full">
                    <h1 class="mb-4 text-xl font-semibold text-gray-700 dark:text-gray-200">
                        ¡Hola, {{ firstName }}! Restablece tu contraseña
                    </h1>



                    <!-- Formulario de restablecimiento de contraseña -->
                    <form (ngSubmit)="resetPassword()">
                        <!-- Campo para nueva contraseña -->
                        <label class="block text-sm">
                            <span class="text-gray-700 dark:text-gray-400">Ingrese su nueva contraseña:</span>
                            <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="Nueva contraseña" class="block w-full mt-1 text-sm form-input" required minlength="8" maxlength="20" />
                        </label>

                        <!-- Campo para confirmar la contraseña -->
                        <label class="block text-sm mt-4">
                            <span class="text-gray-700 dark:text-gray-400">Confirme su contraseña:</span>
                            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirmar contraseña" class="block w-full mt-1 text-sm form-input" required minlength="8" maxlength="20" />
                        </label>

                        <!-- Mensajes de validación -->
                        <div *ngIf="errorMessage" class="mt-4 text-sm font-medium text-red-600">
                            {{ errorMessage }}
                        </div>

                        <!-- Botón de confirmación de contraseña -->
                        <button type="submit" class="block w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white bg-purple-600 rounded-lg hover:bg-purple-700">
                            Confirmar nueva contraseña
                        </button>
                        <!-- Alerta de éxito -->
                        <div *ngIf="message" class="mt-4 text-sm font-medium text-green-600 p-4 bg-green-100 rounded-lg">
                            {{ message }}
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
