<body>
<div class="flex items-center min-h-screen p-6 bg-gray-50 dark:bg-gray-900">
    <div class="flex-1 h-full max-w-4xl mx-auto overflow-hidden bg-white rounded-lg shadow-xl dark:bg-gray-800">
        <div class="flex flex-col overflow-y-auto md:flex-row">
            <div class="h-32 md:h-auto md:w-1/2">
                <img
                    aria-hidden="true"
                    class="object-cover w-full h-full dark:hidden"
                    src="../assets/img/login-office.jpeg"
                    alt="Office"
                />
                <img
                    aria-hidden="true"
                    class="hidden object-cover w-full h-full dark:block"
                    src="../assets/img/login-office-dark.jpeg"
                    alt="Office"
                />
            </div>
            <div class="flex items-center justify-center p-6 sm:p-12 md:w-1/2">
                <div class="w-full">
                    <h1 class="mb-4 text-xl font-semibold text-gray-700 dark:text-gray-200">Inicio de sesión</h1>

                    <!-- Formulario de login -->
                    <form (ngSubmit)="onSubmitLogin()" #loginForm="ngForm">
                        <label class="pad text-sm">
                            <span class="text-gray-700 dark:text-gray-400">Email</span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                [(ngModel)]="email"
                                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input rounded-lg"
                                placeholder="login@example.com"
                                required
                            />
                        </label>

                        <label class="block mt-4 text-sm">
                            <span class="text-gray-700 dark:text-gray-400">Contraseña</span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                [(ngModel)]="password"
                                class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input rounded-lg"
                                placeholder="***************"
                                required
                            />
                        </label>

                        <button
                            type="submit"
                            class="w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-600 hover:bg-purple-700 focus:outline-none focus:shadow-outline-purple"
                        >
                            Entrar
                        </button>

                    </form><br>
                    <!-- Mensaje de error debajo del campo de contraseña -->
                    <div *ngIf="errorMessage" class="text-red-500 text-sm mt-2">
                        {{ errorMessage }}
                    </div>
                    <hr class="my-8" />


                    <p class="mt-4">
                        <a
                            class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline"
                            [routerLink]="'/forgot-password'"
                        >
                            Olvidó su contraseña?
                        </a>
                    </p>

                    <hr class="mt-4">

                    <p class="mt-4">
                        <a
                            class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline"
                            [routerLink]="'/form-registration'"
                        >
                            Crear una cuenta
                        </a>
                    </p>


                </div>
            </div>
        </div>
    </div>
</div>
</body>
