<div class="flex items-center min-h-screen p-6 bg-gray-50 dark:bg-gray-900">
    <div class="flex-1 h-full max-w-4xl mx-auto overflow-hidden bg-white rounded-lg shadow-xl dark:bg-gray-800">
        <div class="flex flex-col overflow-y-auto md:flex-row">
            <div class="h-32 md:h-auto md:w-1/2">
                <img aria-hidden="true" class="object-cover w-full h-full dark:hidden" src="../assets/img/forgot-password-office.jpeg" alt="Office" />
                <img aria-hidden="true" class="hidden object-cover w-full h-full dark:block" src="../assets/img/forgot-password-office-dark.jpeg" alt="Office" />
            </div>
            <div class="flex items-center justify-center p-6 sm:p-12 md:w-1/2">
                <div class="w-full">
                    <h1 class="mb-4 text-xl font-semibold text-gray-700 dark:text-gray-200">Recuperacion de cuenta</h1>

                    <!-- Email input -->
                    <label class="block text-sm">
                        <span class="text-gray-700 dark:text-gray-400">Ingresa tu correo electrónico</span>
                        <input [(ngModel)]="email" class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input" placeholder="usuario@example.com" />
                    </label>

                    <!-- Confirmation checkbox con borde oscuro y tamaño aumentado -->
                    <label class="block text-sm mt-4 flex items-center space-x-2">
                        <input
                            type="checkbox"
                            [(ngModel)]="confirmacion"
                            class="form-checkbox text-purple-600 border-gray-300 dark:border-gray-600 dark:text-purple-600 focus:ring-purple-500 dark:focus:ring-purple-400 h-5 w-5"
                        />
                        <span class="text-md-center">Confirmo que quiero recuperar mi cuenta</span>
                    </label>


                    <!-- Cargando spinner -->
                    <div *ngIf="isLoading" class="flex justify-center mt-4">
                        <!-- Spinner simple usando animate-spin -->
                        <div class="w-8 h-8 border-4 border-t-transparent border-purple-600 rounded-full animate-spin"></div>
                    </div>

                    <!-- Recover password button -->
                    <button (click)="validarAcciones()" class="block w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white transition-colors duration-150 bg-purple-600 border-2 border-transparent rounded-lg hover:bg-purple-700 focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-200">
                        Restablecer contraseña
                    </button>

                    <!-- Error message -->
                    <p *ngIf="mensajeError" class="text-sm text-red-600 mt-4 text-center">{{ mensajeError }}</p>

                    <!-- Back to login link -->
                    <p class="mt-4 text-center">
                        <a class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline" href="./login">Volver al inicio</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Success message -->
        <div *ngIf="mensajeExito" class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50">
            <div class="bg-white p-6 rounded shadow-lg text-center">
                <p>Se ha enviado un enlace de recuperación a su correo.</p>
                <button (click)="cerrarMensajeExito()" class="mt-4 px-4 py-2 text-white bg-purple-600 rounded">Cerrar</button>
            </div>
        </div>
    </div>
</div>
