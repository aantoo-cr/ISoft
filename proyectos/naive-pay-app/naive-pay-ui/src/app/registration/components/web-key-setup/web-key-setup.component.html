<div class="container mx-auto p-4">
  <div class="bg-white shadow-lg rounded-lg p-6 max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-4">Naive-Pay</h1>
    <h2 class="text-xl text-center text-gray-600 mb-6">¡Configure su clave web!</h2>

    <!-- Barra de progreso completa -->
    <div class="w-full bg-gray-300 h-2 mb-6">
      <div class="bg-purple-600 h-full w-1/2" style="width: 50%;"></div>
    </div>

      <form class="configuration-form">
          <table class="w-full text-left mb-4">
              <tr>
                  <td>
                      <label for="web-key" class="text-gray-800 font-semibold">Clave web:</label>
                  </td>
                  <td>
                      <input
                          type="password"
                          id="web-key"
                          [(ngModel)]="key"
                          name="web-key"
                          minlength="12"
                          required
                          class="border-2 border-gray-300 p-2 rounded-lg w-full mb-4"
                          placeholder="Mínimo 12 caracteres, una mayúscula, una minúscula, un número."
                          (input)="validateKeys()"
                      />
                      <div *ngIf="keyFormatError" class="text-red-500 text-sm mb-2">
                          {{ passwordFeedback }}
                      </div>
                  </td>
              </tr>
              <tr>
                  <td>
                      <label for="repetir-clave-web" class="text-gray-800 font-semibold">Repetir clave web:</label>
                  </td>
                  <td>
                      <input
                          type="password"
                          id="repetir-clave-web"
                          [(ngModel)]="confirmKey"
                          name="repetir-clave-web"
                          minlength="12"
                          required
                          class="border-2 border-gray-300 p-2 rounded-lg w-full mb-4"
                          placeholder="Mínimo 12 caracteres, una mayúscula, una minúscula, un número."
                          (input)="validateKeys()"
                      />
                  </td>
              </tr>

              <tr *ngIf="keyMatchError">
                  <td colspan="2" class="text-red-500 text-center mt-2 mb-4">
                      Las claves no coinciden.
                  </td>
              </tr>

              <tr>
                  <td colspan="2" class="text-center mt-6">
                      <button
                          (click)="onSubmit($event)"
                          type="submit"
                          class="bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700 focus:outline-none mt-4">
                          Guardar
                      </button>
                  </td>
              </tr>
          </table>
      </form>
      <div class="navigation-buttons flex justify-between mt-4">
      <button type="button" [routerLink]="'/verify-identity'"
              class="bg-gray-200 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-300 focus:outline-none">Atrás</button>
      <button type="button" onclick="goNext()"
              class="bg-purple-600 text-white py-2 px-4 rounded-lg hover:bg-purple-700 focus:outline-none">Siguiente</button>
    </div>
  </div>
</div>
