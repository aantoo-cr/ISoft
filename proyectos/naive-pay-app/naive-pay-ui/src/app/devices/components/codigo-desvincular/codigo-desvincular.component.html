<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código</title>
    <link href="/dist/output.css" rel="stylesheet">
</head>
<body class="h-full bg-white">
<div class="flex h-full">
    <!-- Sidebar -->
    <app-sidebar class="w-64 bg-gray-800 text-white h-full"></app-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
        <!-- Header -->
        <app-header class="bg-white shadow-md shadow-none lg:shadow-right lg:shadow-bottom lg:shadow-top w-full"></app-header>

        <!-- Content -->
        <div class="flex-1 flex flex-col items-center justify-center px-6 py-12 lg:px-8">
            <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
                <h2 class="text-2xl font-bold tracking-tight text-gray-900">Naive Pay</h2>
                <h1 class="mt-4 text-3xl font-semibold text-gray-800">Código de Verificación</h1>
                <p class="mt-2 text-sm text-gray-600">Ingrese el código de verificación para desvincular su dispositivo</p>
            </div>

            <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                <form class="space-y-6" (ngSubmit)="verificarCodigo()">
                    <!-- Campo de código de verificación -->
                    <div>
                        <label for="codigo" class="block text-sm font-medium text-gray-900">Código de Verificación</label>
                        <div class="mt-2">
                            <input type="text" id="codigo" name="codigo" [(ngModel)]="codigo" placeholder="Ingrese el código de verificación" maxlength="6"
                                   pattern="\d{6}"
                                   required class="block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 py-2 px-3 text-gray-900 sm:text-sm">
                        </div>
                    </div>

                    <!-- Botón de confirmación -->
                    <div class="flex justify-center mt-6">
                        <button type="submit" class="bg-purple-600 text-white px-6 py-3 rounded-lg text-lg font-semibold hover:bg-purple-700 disabled:bg-gray-400">
                            Confirmar
                        </button>
                    </div>

                    <!-- Mostrar mensaje de error si el código no es válido -->
                    <p *ngIf="mensajeCodigoInvalido" class="mt-6 text-center text-sm text-red-500">
                        {{ mensajeCodigoInvalido }}
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
