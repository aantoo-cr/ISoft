<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 transition-opacity"
     *ngIf="showPopup">

  <div class="bg-white rounded-lg shadow-xl p-6 m-4 max-w-sm w-full animate-fade-in-down">
    <h3 class="text-2xl font-bold text-gray-800 items-center">Detalles Del Producto</h3>
    <div class="flex justify-between items-center border-b pb-3">
      <img [src]="product?.proImage" alt="{{product?.proName}}" class="w-full">
    </div>

    <div class="mt-4">
      <div class="px-6 py-4">
        <div class="font-bold text-xl mb-2">{{ product?.proName }}</div>
        <p class="text-gray-700 text-base"><strong>Precio:</strong> {{ product?.proPrice }} </p>
        <p class="text-gray-700 text-base">Descripción: {{ product?.proDescription }} </p>
        <p class="text-gray-700 text-base">Marca: {{ product?.proBrand }} </p>
      </div>
    </div>

    <div class="mt-6 flex justify-end">
      <button class="bg-blue-400 text-white font-bold py-2 px-4 rounded-full" (click)="closePopup()">Cerrar</button>
    </div>

  </div>
</div>
