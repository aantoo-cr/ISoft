      <a href="/">Housing<span
        class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-500 from-cyan-900">Market</span></a>
    </h1>

    <!-- HTML del formulario hecho por chat gpt.  -->
    <!-- barra de búsqueda -->
    <div class="search-bar">
      <div class="search-fieldset">

        <form (ngSubmit)="onSearch()">

          <fieldset class="w-96 space-y-1 text-gray-800">
            <label class="hidden">Search</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-2">
                <button type="submit" title="search" class="p-1 focus:outline-none focus:ring">
                  <svg fill="currentColor" viewBox="0 0 512 512" class="w-4 h-4 text-gray-800">
                    <path
                      d="M479.6,399.716l-81.084-81.084-62.368-25.767A175.014,175.014,0,0,0,368,192c0-97.047-78.953-176-176-176S16,94.953,16,192,94.953,368,192,368a175.034,175.034,0,0,0,101.619-32.377l25.7,62.2L400.4,478.911a56,56,0,1,0,79.2-79.195ZM48,192c0-79.4,64.6-144,144-144s144,64.6,144,144S271.4,336,192,336,48,271.4,48,192ZM456.971,456.284a24.028,24.028,0,0,1-33.942,0l-76.572-76.572-23.894-57.835L380.4,345.771l76.573,76.572A24.028,24.028,0,0,1,456.971,456.284Z"></path>
                  </svg>
                </button>
              </span>

              <input type="text" placeholder="¿Qué tipo de casa busca?" [(ngModel)]="searchTerm" name="searchTerm"
                     class="w-32 min-w-full py-2 pl-10 text-sm rounded-md sm:w-auto focus:outline-none bg-gray-100 text-gray-800 focus:bg-gray-50 focus:border-teal-600">
            </div>
          </fieldset>
        </form>
      </div>
    </div>


    <!-- boón para una nueva casa -->
    <div>
      <button
        type="button"
        (click)="toggleNewHouseForm()"
        class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 px-4 rounded-md shadow">
        Nueva Casa
      </button>
    </div>
  </div>
</nav>

<!-- formulario para casas nuevas -->
<div *ngIf="showNewHouseForm" class="bg-gray-100 py-6">
  <div class="container mx-auto max-w-xl bg-white rounded-lg shadow p-6">
    <h2 class="text-xl font-bold mb-4 text-slate-900">Registrar nueva casa</h2>

    <form (ngSubmit)="onSubmitNewHouse()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
        <input
          type="text"
          [(ngModel)]="newHouse.title"
          name="title"
          required
          class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-emerald-500">
      </div>


      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
        <input
          type="text"
          [(ngModel)]="newHouse.address"
          name="address"
          required
          class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-emerald-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
        <textarea
          [(ngModel)]="newHouse.description"
          name="description"
          rows="3"
          class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-emerald-500"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">URL de foto (opcional)</label>
        <input
          type="text"
          [(ngModel)]="newHouse.photo"
          name="photo"
          class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring focus:border-emerald-500">
      </div>

      <div class="flex items-center gap-2">
        <input
          id="available"
          type="checkbox"
          [(ngModel)]="newHouse.available"
          name="available"
          class="h-4 w-4 text-emerald-600 border-gray-300 rounded">
        <label for="available" class="text-sm text-gray-700">Disponible</label>
      </div>

      <div class="flex justify-end gap-2">
        <button
          type="button"
          (click)="toggleNewHouseForm()"
          class="px-4 py-2 text-sm rounded-md border border-gray-300 text-gray-700">
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm rounded-md bg-emerald-500 text-white font-semibold hover:bg-emerald-600">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- lista de las casas -->
<app-houses-list [houses]="houses"></app-houses-list>
